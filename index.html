<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURORA AI 2.0 Ultra</title>
<style>
*{box-sizing:border-box;font-family:Tajawal,system-ui}
body{margin:0;background:#050a18;color:#fff;min-height:100vh;padding:12px;background:radial-gradient(ellipse at top,#1e2a6b,#050a18)}
.glass{background:rgba(15,22,55,.92);border:1px solid rgba(120,140,255,.25);border-radius:22px;backdrop-filter:blur(20px)}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:14px}
.h-left{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border-radius:14px;overflow:hidden;border:2px solid #7c5cff;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.h-user{display:flex;align-items:center;gap:12px}
.user-img{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid #facc15;box-shadow:0 0 18px rgba(250,204,21,.35);background:#111;flex-shrink:0}
.user-img img{width:100%;height:100%;object-fit:cover;display:block}
.main{text-align:center;padding:28px 18px}
.tag{display:inline-block;margin:6px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:13px}
</style>
</head>
<body>
<div class="header glass">
<div class="h-left">
<div class="logo"><img src="logo.png" alt="AURORA"></div>
<div><div style="font-weight:900;font-size:16px">AURORA AI 2.0 Ultra</div><div style="font-size:12px;color:#8a90b8">Super Intelligence • Active now</div></div>
</div>
<div class="h-user">
<div style="text-align:right"><div style="font-weight:800;font-size:13px">المطور عبد الرحيم الغرام</div><div style="font-size:11px;color:#10b981">● Rochie • 🛡️ Verified Pro</div></div>
<div class="user-img"><img src="me.png" alt="Rochie"></div>
</div>
</div>
<div class="main glass">
<div style="font-size:28px;font-weight:900">AURORA AI Ultra</div>
<div style="color:#a78bfa;font-weight:700;margin:6px 0">Super Intelligence</div>
<div style="margin-top:16px">
<span class="tag">🎥 Video Creation</span>
<span class="tag">📷 4K Image Generation</span>
<span class="tag">💻 Code Analysis</span>
</div>
</div>
</body>
</html>
