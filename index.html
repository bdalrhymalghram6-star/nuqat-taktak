 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقاط تكتك - مجاني للأبد</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Tajawal}
body{background:#0a0a12;color:#fff;margin:0;padding:16px;min-height:100vh}
.container{max-width:680px;margin:0 auto}
h1{text-align:center;background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2rem;margin:10px 0}
.card{background:#151525;border:1px solid #2a2a4a;border-radius:18px;padding:16px;margin:16px 0}
textarea{width:100%;background:#0f0f1e;border:1px solid #3a3a5a;color:#fff;padding:14px;border-radius:12px;font-size:16px;outline:none}
select{background:#0f0f1e;border:1px solid #3a3a5a;color:#fff;padding:10px;border-radius:10px;width:100%}
button{width:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border:none;color:#fff;padding:15px;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
#result img{width:100%;border-radius:14px;margin-top:12px;border:1px solid #333}
.badge{display:inline-block;background:#10b98120;color:#10b981;padding:4px 10px;border-radius:20px;font-size:12px;margin:3px}
</style>
</head>
<body>
<div class="container">
<h1>🎨 نقاط تكتك 3.0</h1>
<p style="text-align:center;opacity:.6;font-size:14px">مجاني 100% - بدون مفتاح - بدون اشتراك - بدون Weft</p>
<div class="card">
<span class="badge">✅ مجاني للأبد</span>
<span class="badge">✅ يعمل في اليمن</span>
<span class="badge">✅ بدون تسجيل</span>
<textarea id="prompt" rows="3" placeholder="اكتب وصف الصورة هنا... مثال: ولد حضرمي واقف على بحر المكلا وقت الغروب، تصوير سينمائي 4K"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<select id="style">
<option value="">ستايل عادي</option>
<option value=", cinematic, ultra detailed, 8k">🎬 سينمائي</option>
<option value=", anime style, studio ghibli">🎌 انمي</option>
<option value=", photorealistic, DSLR, highly detailed">📸 واقعي</option>
<option value=", 3d render, octane render">🧊 ثلاثي الأبعاد</option>
<option value=", cyberpunk, neon lights">🌃 سايبربانك</option>
</select>
<select id="ratio">
<option value="1024x1024">⬜ مربع</option>
<option value="1280x720">📺 أفقي</option>
<option value="720x1280">📱 عمودي</option>
</select>
</div>
<button id="genBtn" onclick="generate()">توليد صورة 4K مجاناً 🎨</button>
<button onclick="randomPrompt()" style="background:#1f1f35;font-size:13px;margin-top:8px">🎲 فكرة عشوائية</button>
</div>
<div class="card" id="result" style="display:none">
<div id="status">جاري التوليد...</div>
<img id="img" crossorigin="anonymous"/>
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="downloadImg()" style="flex:1;background:#1f1f35;font-size:14px">⬇️ تحميل</button>
<button onclick="newSeed()" style="flex:1;background:#1f1f35;font-size:14px">🔄 صورة أخرى</button>
</div>
</div>
</div>
<script>
const prompts=["مدينة المكلا اليمنية في الليل، أضواء نيون، سيارات مستقبلية، 4K","ولد يمني يلبس ثوب حضرمي يمشي في سوق قديم، تصوير سينمائي","مسجد في حضرموت فوق جبل، غيوم، إضاءة ذهبية","فتاة عربية تقرأ كتاب في مكتبة ضخمة مستقبلية","سيارة لامبورجيني في صحراء حضرموت، غروب"];
function randomPrompt(){document.getElementById('prompt').value=prompts[Math.floor(Math.random()*prompts.length)];}
let lastPrompt="",lastSeed=0;
function generate(){
const p=document.getElementById('prompt').value.trim();
if(!p){alert('اكتب وصف الصورة أولاً');return}
const style=document.getElementById('style').value;
const ratio=document.getElementById('ratio').value.split('x');
lastPrompt=p+style;
lastSeed=Math.floor(Math.random()*999999);
const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(lastPrompt)}?width=${ratio[0]}&height=${ratio[1]}&seed=${lastSeed}&nologo=true&enhance=true&model=flux`;
show(url);
}
function newSeed(){
if(!lastPrompt)return;
lastSeed=Math.floor(Math.random()*999999);
const ratio=document.getElementById('ratio').value.split('x');
const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(lastPrompt)}?width=${ratio[0]}&height=${ratio[1]}&seed=${lastSeed}&nologo=true&enhance=true&model=flux`;
show(url);
}
function show(url){
document.getElementById('result').style.display='block';
document.getElementById('status').innerText='⏳ جاري التوليد (5-10 ثواني)...';
const img=document.getElementById('img');
img.src=url;
document.getElementById('genBtn').disabled=true;
document.getElementById('genBtn').innerText='جاري...';
img.onload=()=>{
document.getElementById('status').innerText='✅ تم! مجاني 100%';
document.getElementById('genBtn').disabled=false;
document.getElementById('genBtn').innerText='توليد صورة 4K مجاناً 🎨';
window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
};
}
function downloadImg(){
const img=document.getElementById('img');
if(!img.src)return;
window.open(img.src,'_blank');
}
</script>
</body>
</html>
