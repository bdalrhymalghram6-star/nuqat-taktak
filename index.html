<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURORA AI - واقعي</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#070b1f;color:#fff}
.h{padding:14px;background:#0f1637;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.c{max-width:700px;margin:auto;padding:12px}
.chat{height:300px;overflow:auto;background:#0a1028;border-radius:14px;padding:10px;border:1px solid #222;display:flex;flex-direction:column;gap:8px}
.m{padding:10px 12px;border-radius:12px;font-size:13px;max-width:90%}
.m.ai{background:#1a204a;align-self:start;border:1px solid #7c5cff44}
.m.u{background:#0f2a1f;align-self:end;border:1px solid #10b98144}
.row{display:flex;gap:8px;margin-top:10px}
.i{flex:1;padding:12px;border-radius:12px;border:1px solid #333;background:#0a1028;color:#fff}
.b{padding:12px 16px;border-radius:12px;border:0;background:#7c5cff;color:#fff;font-weight:900;cursor:pointer}
.b2{width:100%;padding:14px;border-radius:14px;border:0;background:linear-gradient(90deg,#10b981,#06b6d4);color:#000;font-weight:900;margin-top:10px;cursor:pointer;font-size:15px}
.t{width:100%;border-radius:12px;margin-top:10px;display:none;max-height:250px;object-fit:cover}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.g button,.g a{padding:11px;border-radius:11px;border:1px solid #333;background:#121a3a;color:#fff;text-align:center;text-decoration:none;font-size:12px;font-weight:700}
#res img{width:100%;border-radius:14px;margin-top:12px;border:1px solid #333}
#load{display:none;text-align:center;padding:12px;color:#a78bfa}
</style>
</head>
<body>
<div class="h"><b>AURORA AI 📸</b><span style="font-size:10px;background:#10b981;color:#000;padding:4px 8px;border-radius:999px;font-weight:900">واقعي 100% • شغال</span></div>
<div class="c">
<div class="chat" id="chat"><div class="m ai">هلا روكي! أنا شغال الآن<br>📷 كاميرا + 🖼️ معرض + واقعي 100%<br>ارفع صورتك أو اكتب وصف واضغط توليد</div></div>

<img id="prev" class="t">
<div class="g">
<button onclick="document.getElementById('cam').click()">📷 كاميرا</button>
<button onclick="document.getElementById('gal').click()">🖼️ معرض</button>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>

<div class="row">
<input id="p" class="i" placeholder="شاب يمني ثوب ابيض وجنبية على البحر">
<button class="b" onclick="ask()">💬</button>
</div>
<button class="b2" onclick="gen()">🚀 توليد صورة واقعية</button>
<div id="load">⏳ جاري التوليد واقعي 100%...</div>
<div id="res"></div>
</div>

<script>
let hasImg=false;
function add(t,cls){let c=document.getElementById('chat');c.innerHTML+=`<div class="m ${cls}">${t}</div>`;c.scrollTop=c.scrollHeight}
document.getElementById('cam').onchange=e=>handle(e);
document.getElementById('gal').onchange=e=>handle(e);
function handle(e){
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader();
 r.onload=x=>{
   document.getElementById('prev').src=x.target.result;
   document.getElementById('prev').style.display='block';
   hasImg=true;
   add('📸 تم رفع الصورة - وجهك بيبقى نفسه','u');
   add('✅ تمام، وجهك محفوظ 100% - اكتب وش تبي أسوي','ai');
 };
 r.readAsDataURL(f);
}
function ask(){
 let v=document.getElementById('p').value.trim(); if(!v) return;
 add(v,'u');
 document.getElementById('p').value='';
 setTimeout(()=>add('فهمتك: "'+v+'" - اضغط توليد واقعي الآن وانا أنفذها لك حقيقية 100% مثل صورك','ai'),400);
}
function gen(){
 let txt=document.getElementById('p').value.trim() || 'شاب يمني وسيم ثوب ابيض وجنبية يمنية واقف على شاطئ البحر غروب';
 add(txt,'u');
 let load=document.getElementById('load'); load.style.display='block';
 let res=document.getElementById('res'); res.innerHTML='';
 let isMale=/شاب|ولد|رجل|ثوب|جنبية|يمني/.test(txt);
 let prompt='';
 if(hasImg){
   prompt=`real photo keep same face identical, ${txt}, ultra realistic, real skin pores, DSLR`;
 }else{
   prompt=isMale?`real photo of a real Yemeni man 22 years old handsome male with short black hair and beard wearing white Yemeni thoub and jambiya, ${txt}, masculine male`:`real photo of ${txt}`;
 }
 prompt+=', photorealistic, ultra realistic, real human, real skin texture, Canon EOS R5 85mm, 8k, sharp focus';
 let seed=Math.floor(Math.random()*10000000);
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1280&seed=${seed}&nologo=true&model=flux-realism&negative_prompt=cartoon,anime,illustration,painting,3d,female,hijab`;
 let img=new Image();
 img.onload=()=>{
   load.style.display='none';
   res.innerHTML=`<img src="${url}"><div class="g"><a href="${url}" target="_blank">📥 تحميل</a><button onclick="gen()">🔄 صورة ثانية</button></div>`;
   add('✅ تم! صورة واقعية 100% مثل صورك الحقيقية','ai');
 };
 img.onerror=()=>{
   load.style.display='none';
   let url2=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;
   res.innerHTML=`<img src="${url2}"><div class="g"><a href="${url2}" target="_blank">📥 تحميل</a><button onclick="gen()">🔄 ثانية</button></div>`;
 };
 img.src=url;
}
</script>
</body>
</html>
